document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ackground:var(--acc);color:#04121b;font-weight:600;font-size:13.5px;padding:10px 16px;border-radius:8px;border:0;cursor:pointer;font-family:'IBM Plex Mono',monospace;flex:none}\n.runb:hover{filter:brightness(1.08)}\n.runb:disabled{opacity:.5;cursor:default;filter:none}\n.prog{flex:1;height:6px;background:#141b25;border-radius:4px;overflow:hidden}\n.bar{height:100%;background:var(--acc);width:0;transition:width .4s ease}\n.pstat{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8b94a6;white-space:nowrap;flex:none}\n.term{margin-top:16px;background:#070a0e;border:1px solid #18212d;border-radius:10px;padding:14px 16px;font-family:'IBM Plex Mono',monospace;font-size:12.7px;line-height:1.8;min-height:152px;overflow-x:auto}\n.empty{color:#4d5663}\n.l-cmd{color:#dbe3ef}\n.l-dim{color:#727d8e}\n.l-warn{color:#f5a524}\n.l-ok{color:#43c463}\n.cursor{display:inline-block;width:8px;height:13px;background:var(--acc);vertical-align:-2px;animation:bk 1s steps(1) infinite;margin-left:2px}\n@keyframes bk{50%{opacity:0}}\n.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}\n.fcard{border:1px solid #1a2330;border-radius:12px;background:#0c1119;padding:22px;transition:border-color .2s}\n.fcard:hover{border-color:#2c3a4c}\n.fnum{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--acc)}\n.fh{font-size:17px;font-weight:600;margin:14px 0 0;letter-spacing:-.01em}\n.fp{font-size:13.5px;line-height:1.62;color:#97a0b1;margin:10px 0 0}\n.fp code{font-family:'IBM Plex Mono',monospace;font-size:.92em;color:#c4cdda}\n.tabs{display:flex;gap:4px;margin-top:28px;border-bottom:1px solid #1a2330}\n.tab{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#8b94a6;padding:10px 15px;border:0;background:transparent;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}\n.tab:hover{color:#cdd5e2}\n.tab.on{color:#fff;border-bottom-color:var(--acc)}\n.pane{display:none;margin-top:18px;position:relative}\n.pane.on{display:block}\n.code{background:#070a0e;border:1px solid #18212d;border-radius:10px;padding:18px 18px;font-family:'IBM Plex Mono',monospace;font-size:13.3px;line-height:1.85;color:#cdd5e2;white-space:pre;overflow-x:auto}\n.code .c{color:#5f6b7a}\n.code .pr{color:var(--acc)}\n.code .fl{color:#f5a524}\n.copyp{position:absolute;top:13px;right:13px;cursor:pointer;color:#6b7585;border:1px solid #232e3d;background:#0d131c;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:5px 9px}\n.copyp:hover{color:#fff;border-color:var(--acc)}\n.foot{border-top:1px solid #18202b;margin-top:30px;padding:34px 0 60px}\n.footrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;font-size:13px;color:#8b94a6}\n.footrow a:hover{color:#fff}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"page {{ gridCls }}\" style=\"{{ pageStyle }}\">\n<nav class=\"nav\"><div class=\"wrap navin\"><div class=\"brand\"><span class=\"brandmk\"><\u002Fspan><span class=\"mono\">ros2bag_repairer<\u002Fspan><\u002Fdiv><div class=\"navlinks\"><a class=\"navlink\" href=\"#demo\">Demo<\u002Fa><a class=\"navlink\" href=\"#features\">What it does<\u002Fa><a class=\"navlink\" href=\"#install\">Install<\u002Fa><a class=\"gh\" href=\"https://github.com/wuisabel-gif/ros2bag_repairer\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>GitHub<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fnav>\n<header class=\"hero\"><div class=\"wrap\"><div class=\"eyebrow\">ROS 2 · rosbag2 recovery<\u002Fdiv><h1 class=\"h1\" style=\"font-family: Caveat; font-size: 70px\">Repair the rosbag2 that <span class=\"u\">refused to play.<\u002Fspan><\u002Fh1><p class=\"lede\" style=\"font-family: inherit\">Competition robots crash. Batteries die. <code>Ctrl-C<\u002Fcode> lands a second too early — and the match you needed is a half-written bag directory that <code>ros2 bag play<\u002Fcode> won't touch. ros2bag_repairer rebuilds the <code>metadata.yaml<\u002Fcode> and recovers the <code>.db3<\u002Fcode>, so the run survives.<\u002Fp><div class=\"cta\"><div class=\"cmd\"><span><span class=\"pr\">$<\u002Fspan> pip install ros2bag-repairer<\u002Fspan><button class=\"cp\" onclick=\"{{ copyHero }}\">{{ copyLabel }}<\u002Fbutton><\u002Fdiv><a class=\"btnp\" href=\"https://github.com/wuisabel-gif/ros2bag_repairer\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>View on GitHub<\u002Fa><a class=\"btnp\" href=\"repair.html\">Try it in your browser →<\u002Fa><\u002Fdiv><div class=\"facts\"><b>every committed message<\u002Fb><span class=\"dotsep\">/<\u002Fspan><b>SQLite .db3 bags<\u002Fb><span class=\"dotsep\">/<\u002Fspan><b>no ROS 2 needed<\u002Fb><span class=\"dotsep\">/<\u002Fspan><b>Apache-2.0<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fheader>\n<section class=\"sec\" id=\"demo\"><div class=\"wrap\"><h2 class=\"h2\" style=\"font-family: Caveat\">Watch a dead bag come back.<\u002Fh2><p class=\"sub2\">A bag that lost power mid-record — the <code>metadata.yaml<\u002Fcode> is gone and the <code>.db3<\u002Fcode> is truncated. Press run and watch the recovery rebuild it, message by message.<\u002Fp>\n<div class=\"demo\"><div class=\"dgrid\">\n<div class=\"bcard bad\"><div class=\"chd\"><span class=\"nm\">rosbag2_2026_03_14-final_match/<\u002Fspan><span class=\"tag bad\">IMPAIRED<\u002Fspan><\u002Fdiv><div class=\"frow\"><span class=\"ic bad\">✕<\u002Fspan><div><div class=\"rlabel\">metadata.yaml<\u002Fdiv><div class=\"rsub bad\">missing · process killed mid-write<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"frow\"><span class=\"ic bad\">✕<\u002Fspan><div><div class=\"rlabel\">recording.db3<\u002Fdiv><div class=\"rsub bad\">truncated · 1.21 GB on disk<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"frow\"><span class=\"ic bad\">✕<\u002Fspan><div><div class=\"rlabel\">message index<\u002Fdiv><div class=\"rsub bad\">mismatch · says 184k, reads 0<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"frow\"><span class=\"ic bad\">✕<\u002Fspan><div><div class=\"rlabel\">duration<\u002Fdiv><div class=\"rsub bad\">unknown<\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"frow last\"><span class=\"ic bad\">✕<\u002Fspan><div><div class=\"rlabel\">ros2 bag play<\u002Fdiv><div class=\"rsub bad\">[ERROR] could not load metadata<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"{{ arrowCls }}\">→<\u002Fdiv>\n<div class=\"bcard good\"><div class=\"chd\"><span class=\"nm\">…_final_match_repaired/<\u002Fspan><span class=\"tag {{ rightTagCls }}\">{{ rightTagText }}<\u002Fspan><\u002Fdiv><sc-for list=\"{{ rightRows }}\" as=\"row\" hint-placeholder-count=\"5\"><div class=\"frow\"><span class=\"{{ row.iconCls }}\">{{ row.iconChar }}<\u002Fspan><div><div class=\"rlabel\">{{ row.label }}<\u002Fdiv><div class=\"{{ row.subCls }}\">{{ row.sub }}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"ctl\"><button class=\"runb\" onclick=\"{{ ctrlAction }}\" disabled=\"{{ ctrlDisabled }}\">{{ ctrlLabel }}<\u002Fbutton><div class=\"prog\"><div class=\"bar\" style=\"width: {{ progressPct }}\"><\u002Fdiv><\u002Fdiv><span class=\"pstat\">{{ pstatText }}<\u002Fspan><\u002Fdiv>\n<div class=\"term\"><sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ true }}\"><div class=\"empty\">› awaiting repair — press “run repair”<\u002Fdiv><\u002Fsc-if><sc-for list=\"{{ visible }}\" as=\"line\" hint-placeholder-count=\"3\"><div class=\"{{ line.cls }}\">{{ line.txt }}<\u002Fdiv><\u002Fsc-for><sc-if value=\"{{ running }}\"><div class=\"l-dim\">recovering<span class=\"cursor\"><\u002Fspan><\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" id=\"features\"><div class=\"wrap\"><div class=\"kicker\">What it does<\u002Fdiv><h2 class=\"h2\">Built to salvage the only copy you have.<\u002Fh2><div class=\"fgrid\">\n<div class=\"fcard\" style=\"display: none\"><div class=\"fnum\">01<\u002Fdiv><div class=\"fh\">Rebuild metadata.yaml<\u002Fdiv><p class=\"fp\">Reconstructs the topic list, message counts, durations and start/end timestamps directly from the <code>.db3<\u002Fcode> when the YAML is missing or truncated.<\u002Fp><\u002Fdiv>\n<div class=\"fcard\"><div class=\"fnum\">02<\u002Fdiv><div class=\"fh\">Recover a truncated .db3<\u002Fdiv><p class=\"fp\">Reads past a half-finished SQLite write, salvaging every committed message instead of throwing away the whole recording.<\u002Fp><\u002Fdiv>\n<div class=\"fcard\"><div class=\"fnum\">03<\u002Fdiv><div class=\"fh\">Verify message integrity<\u002Fdiv><p class=\"fp\">Cross-checks the index against the message table so playback counts match what actually hit disk — no silent drops.<\u002Fp><\u002Fdiv>\n<div class=\"fcard\"><div class=\"fnum\">04<\u002Fdiv><div class=\"fh\">Backs up before it recovers<\u002Fdiv><p class=\"fp\">Rebuilds metadata in place; before rewriting a database it backs the original up to .db3.bak, and --output writes a separate repaired copy. Safe to run on the one recording you can't afford to lose.<\u002Fp><\u002Fdiv>\n<div class=\"fcard\"><div class=\"fnum\">05<\u002Fdiv><div class=\"fh\">SQLite .db3, no ROS needed<\u002Fdiv><p class=\"fp\">Works straight on the rosbag2 sqlite3 .db3 — no ROS 2 install, no daemon, no sourcing a workspace. (MCAP backend not supported yet.)<\u002Fp><\u002Fdiv>\n<div class=\"fcard\"><div class=\"fnum\">06<\u002Fdiv><div class=\"fh\">Made for the pit<\u002Fdiv><p class=\"fp\">One command, no ROS daemon required. Recover a match on the pit laptop minutes before your next run.<\u002Fp><\u002Fdiv>\n<\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section class=\"sec\" id=\"install\"><div class=\"wrap\"><div class=\"kicker\">Get started<\u002Fdiv><h2 class=\"h2\">Install it in one line.<\u002Fh2><div class=\"tabs\"><button class=\"{{ pipBtn }}\" onclick=\"{{ setPip }}\">pip<\u002Fbutton><button class=\"{{ sourceBtn }}\" onclick=\"{{ setSource }}\">build from source<\u002Fbutton><button class=\"{{ aptBtn }}\" onclick=\"{{ setApt }}\">apt<\u002Fbutton><button class=\"{{ cliBtn }}\" onclick=\"{{ setCli }}\">usage<\u002Fbutton><\u002Fdiv>\n<div class=\"pane {{ pipOn }}\"><button class=\"copyp\" onclick=\"{{ copyInstall }}\">{{ copyLabel }}<\u002Fbutton><div class=\"code\"><span class=\"pr\">$<\u002Fspan> pip install ros2bag-repairer<\u002Fdiv><\u002Fdiv>\n<div class=\"pane {{ sourceOn }}\"><button class=\"copyp\" onclick=\"{{ copyInstall }}\">{{ copyLabel }}<\u002Fbutton><div class=\"code\"><div class=\"c\"># clone, then install with pip — it is a normal Python package<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> git clone https://github.com/wuisabel-gif/ros2bag_repairer.git<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> cd ros2bag_repairer<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> pip install -e .<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> ros2bag-repair --help<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"pane {{ aptOn }}\"><button class=\"copyp\" onclick=\"{{ copyInstall }}\">{{ copyLabel }}<\u002Fbutton><div class=\"code\"><div><span class=\"pr\">$<\u002Fspan> # there is no apt package — install with pip (first tab)<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> # runtime deps: PyYAML and the <span class=\"fl\">sqlite3<\u002Fspan> CLI<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div class=\"pane {{ cliOn }}\"><button class=\"copyp\" onclick=\"{{ copyInstall }}\">{{ copyLabel }}<\u002Fbutton><div class=\"code\"><div class=\"c\"># repair a bag — rebuilds metadata.yaml in place<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> ros2bag-repair rosbag2_2026_03_14-final_match/<\u002Fdiv><div class=\"sp\"> <\u002Fdiv><div class=\"c\"># choose where the repaired bag goes<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> ros2bag-repair my_bag/ <span class=\"fl\">--output<\u002Fspan> my_bag_fixed/<\u002Fdiv><div class=\"sp\"> <\u002Fdiv><div class=\"c\"># force a full sqlite .recover even if the bag looks ok<\u002Fdiv><div><span class=\"pr\">$<\u002Fspan> ros2bag-repair my_bag/ <span class=\"fl\">--force-recover<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n<footer class=\"foot\"><div class=\"wrap footrow\"><div class=\"brand\"><span class=\"brandmk\"><\u002Fspan><span class=\"mono\">ros2bag_repairer<\u002Fspan><\u002Fdiv><div>Apache-2.0 licensed · © Isabel Wu<\u002Fdiv><a class=\"gh\" href=\"https://github.com/wuisabel-gif/ros2bag_repairer\" target=\"_blank\" rel=\"noopener\"><svg viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z\"><\u002Fpath><\u002Fsvg>wuisabel-gif/ros2bag_repairer<\u002Fa><\u002Fdiv><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2bb0ec&quot;,&quot;options&quot;:[&quot;#2bb0ec&quot;,&quot;#43c463&quot;,&quot;#f5a524&quot;,&quot;#c7d0de&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;gridLines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;repairStepMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:560,&quot;min&quot;:250,&quot;max&quot;:900,&quot;step&quot;:10,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nclass Component extends DCLogic {\n  state = { step: 0, running: false, activeTab: 'pip', copied: false };\n\n  cmds() {\n    return {\n      pip: 'pip install ros2bag-repairer',\n      source: 'git clone https://github.com/wuisabel-gif/ros2bag_repairer.git\\ncd ros2bag_repairer\\ncd ~/ros2_ws && colcon build --packages-select ros2bag_repairer\\nros2bag-repair --help',\n      apt: '# there is no apt package — install with pip (first tab)\\n# runtime deps: PyYAML and the sqlite3 CLI',\n      cli: 'ros2bag-repair rosbag2_2026_03_14-final_match/'\n    };\n  }\n\n  run() {\n    if (this.state.running) return;\n    const ms = this.props.repairStepMs || 560;\n    this.setState({ running: true });\n    clearInterval(this.timer);\n    this.timer = setInterval(() => {\n      this.setState(s => {\n        const ns = s.step + 1;\n        if (ns >= 8) { clearInterval(this.timer); return { step: 8, running: false }; }\n        return { step: ns };\n      });\n    }, ms);\n  }\n\n  runAgain() {\n    clearInterval(this.timer);\n    this.setState({ step: 0, running: false });\n    setTimeout(() => this.run(), 70);\n  }\n\n  copy(t) {\n    try { navigator.clipboard.writeText(t); } catch (e) {}\n    this.setState({ copied: true });\n    clearTimeout(this.ct);\n    this.ct = setTimeout(() => this.setState({ copied: false }), 1400);\n  }\n\n  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.ct); }\n\n  renderVals() {\n    const step = this.state.step;\n    const running = this.state.running;\n    const done = step >= 8;\n    const lines = [\n      { txt: '$ ros2bag-repair rosbag2_2026_03_14-final_match/', cls: 'l-cmd' },\n      { txt: '[scan]  storage backend: sqlite3 · recording.db3 (1.21 GB)', cls: 'l-dim' },\n      { txt: '[scan]  SQLite header intact · WAL journal present', cls: 'l-dim' },\n      { txt: '[warn]  metadata.yaml not found — reconstructing from db3', cls: 'l-warn' },\n      { txt: '[recover] walking message table … 184,302 records found', cls: 'l-dim' },\n      { txt: '[recover] rebuilding topic index · 6 topics', cls: 'l-dim' },\n      { txt: '[write]  metadata.yaml written · duration 00:07:43', cls: 'l-dim' },\n      { txt: '[ ok ]  bag repaired in 4.31s · 0 messages lost', cls: 'l-ok' }\n    ];\n    const visible = lines.slice(0, step).map((l, i) => ({ txt: l.txt, cls: l.cls, key: i }));\n    const rows = [\n      { id: 'meta', label: 'metadata.yaml', fixed: 'rebuilt · 6 topics', at: 7 },\n      { id: 'db3', label: 'recording.db3', fixed: 'recovered · 184,302 msgs', at: 6 },\n      { id: 'idx', label: 'message index', fixed: '184,302 verified', at: 5 },\n      { id: 'dur', label: 'duration', fixed: '00:07:43', at: 7 },\n      { id: 'play', label: 'ros2 bag play', fixed: 'ready', at: 8 }\n    ];\n    const rightRows = rows.map(r => {\n      const ok = step >= r.at;\n      return {\n        id: r.id, label: r.label,\n        sub: ok ? r.fixed : 'pending…',\n        iconChar: ok ? '✓' : '·',\n        iconCls: ok ? 'ic on' : 'ic',\n        subCls: ok ? 'rsub ok' : 'rsub'\n      };\n    });\n    const pct = Math.round(step / 8 * 100) + '%';\n    const at = this.state.activeTab;\n    const tab = c => at === c ? 'tab on' : 'tab';\n    const pstatText = (!running && step === 0) ? 'idle'\n      : done ? 'repaired · 0 messages lost'\n      : 'recovering… ' + pct;\n    return {\n      pageStyle: { ['--acc']: this.props.accentColor || '#2bb0ec' },\n      gridCls: this.props.gridLines === false ? 'nogrid' : '',\n      visible, rightRows,\n      running, isEmpty: step === 0,\n      progressPct: pct, pstatText,\n      arrowCls: running ? 'arrow run' : 'arrow',\n      rightTagCls: done ? 'good' : 'wait',\n      rightTagText: done ? 'REPAIRED' : (running ? 'REPAIRING…' : 'AWAITING'),\n      ctrlLabel: running ? 'repairing…' : (done ? '↻ run again' : '▸ run repair'),\n      ctrlDisabled: running,\n      ctrlAction: done ? () => this.runAgain() : () => this.run(),\n      copyLabel: this.state.copied ? 'copied ✓' : 'copy',\n      copyHero: () => this.copy('pip install ros2bag-repairer'),\n      copyInstall: () => this.copy(this.cmds()[this.state.activeTab]),\n      pipOn: at === 'pip' ? 'on' : '', sourceOn: at === 'source' ? 'on' : '',\n      aptOn: at === 'apt' ? 'on' : '', cliOn: at === 'cli' ? 'on' : '',\n      pipBtn: tab('pip'), sourceBtn: tab('source'), aptBtn: tab('apt'), cliBtn: tab('cli'),\n      setPip: () => this.setState({ activeTab: 'pip' }),\n      setSource: () => this.setState({ activeTab: 'source' }),\n      setApt: () => this.setState({ activeTab: 'apt' }),\n      setCli: () => this.setState({ activeTab: 'cli' })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
