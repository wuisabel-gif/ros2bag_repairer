[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2bag-repairer"
version = "0.1.0"
description = "Repair incomplete or corrupt rosbag2 (sqlite3 .db3) bags by recovering the database and rebuilding metadata.yaml — no ROS 2 install required."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Isabel Wu", email = "wuisabel@usc.edu" }]
keywords = ["ros2", "rosbag2", "rosbag", "sqlite3", "recovery", "repair", "robotics"]
dependencies = ["PyYAML>=5.3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/wuisabel-gif/ros2bag_repairer"
Repository = "https://github.com/wuisabel-gif/ros2bag_repairer"
Issues = "https://github.com/wuisabel-gif/ros2bag_repairer/issues"

[project.scripts]
ros2bag-repair = "ros2bag_repairer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
